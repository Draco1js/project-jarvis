<!-- Create a websocket connection and a simple text input and output -->
<!DOCTYPE html>
<html>
<head>
    <title>Jarvis Chat</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="chat-container">
        <div id="header">
            <h1>Jarvis Chat</h1>
            <div id="connection-status">Disconnected</div>
        </div>
        <div id="chat-area">
            <div id="output"></div>
            <div id="searching-indicator" class="hidden">
                <div class="spinner"></div>
                <span>Searching the web...</span>
            </div>
            <div id="input-area">
                <input type="text" id="message" placeholder="Type a message...">
                <button onclick="sendMessage()" id="send-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        <div id="debug-panel">
            <div id="last-event">Last Event: None</div>
            <div id="error-log">No errors</div>
        </div>
    </div>

    <script>
        const socket = io('http://localhost:3000');
        const output = document.getElementById('output');
        const messageInput = document.getElementById('message');
        const connectionStatus = document.getElementById('connection-status');
        const lastEvent = document.getElementById('last-event');
        const errorLog = document.getElementById('error-log');
        const searchingIndicator = document.getElementById('searching-indicator');
        const ROOM = 'default';
        let currentMessageDiv = null;
        let currentTextDiv = null;

        function logError(error) {
            console.error(error);
            errorLog.innerHTML = `Error: ${error.message}`;
            errorLog.style.color = '#ef4444';
        }

        function formatTimestamp(timestamp) {
            return new Date(timestamp).toLocaleTimeString();
        }

        function createMessageContainer(isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'jarvis-message'}`;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = formatTimestamp(Date.now());
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            
            messageDiv.appendChild(timeDiv);
            messageDiv.appendChild(textDiv);
            
            return { messageDiv, textDiv };
        }

        function addMessageToChat(text, timestamp, isUser = false) {
            const { messageDiv, textDiv } = createMessageContainer(isUser);
            textDiv.textContent = text;
            output.appendChild(messageDiv);
            output.scrollTop = output.scrollHeight;
            return { messageDiv, textDiv };
        }

        socket.on('connect', function() {
            console.log('Connected to server');
            connectionStatus.textContent = 'Connected';
            connectionStatus.className = 'connected';
            lastEvent.textContent = 'Last Event: Connection opened';
            socket.emit('join_room', ROOM);
        });

        socket.on('disconnect', function() {
            console.log('Disconnected from server');
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.className = 'disconnected';
            lastEvent.textContent = 'Last Event: Connection closed';
        });

        socket.on('connect_error', function(error) {
            logError(error);
            lastEvent.textContent = 'Last Event: Connection error';
        });

        socket.on('chat_history', function(messages) {
            output.innerHTML = ''; // Clear existing messages
            messages.forEach(msg => addMessageToChat(msg.text, msg.timestamp, msg.isUser));
        });

        socket.on('response_chunk', function(data) {
            if (!currentMessageDiv) {
                const result = createMessageContainer(false);
                currentMessageDiv = result.messageDiv;
                currentTextDiv = result.textDiv;
                output.appendChild(currentMessageDiv);
            }
            
            currentTextDiv.textContent += data.text;
            output.scrollTop = output.scrollHeight;
            lastEvent.textContent = `Last Event: Received chunk (${formatTimestamp(data.timestamp)})`;
        });

        socket.on('response_complete', function(data) {
            if (currentMessageDiv) {
                currentMessageDiv = null;
                currentTextDiv = null;
            }
            lastEvent.textContent = `Last Event: Response complete (${formatTimestamp(data.timestamp)})`;
        });

        socket.on('status_update', function(data) {
            if (data.status === 'searching') {
                searchingIndicator.classList.remove('hidden');
                lastEvent.textContent = `Last Event: Searching web (${formatTimestamp(data.timestamp)})`;
            } else if (data.status === 'complete') {
                searchingIndicator.classList.add('hidden');
                lastEvent.textContent = `Last Event: Search complete (${formatTimestamp(data.timestamp)})`;
            }
        });

        function sendMessage() {
            try {
                const message = messageInput.value;
                if (message.trim()) {
                    const timestamp = Date.now();
                    socket.emit('command_text', { room: ROOM, text: message });
                    addMessageToChat(message, timestamp, true);
                    lastEvent.textContent = `Last Event: Message sent (${formatTimestamp(timestamp)})`;
                    messageInput.value = '';
                }
            } catch (error) {
                logError(error);
            }
        }

        // Allow sending message with Enter key
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus input on load
        messageInput.focus();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            padding: 1rem;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        #connection-status {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        #connection-status.connected {
            background: #22c55e;
        }

        #connection-status.disconnected {
            background: #ef4444;
        }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            position: relative;
        }

        .user-message {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .jarvis-message {
            align-self: flex-start;
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 0.25rem;
        }

        .message-text {
            line-height: 1.5;
        }

        #input-area {
            padding: 1rem;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 0.5rem;
        }

        #message {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #message:focus {
            border-color: #3b82f6;
        }

        #send-button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #send-button:hover {
            background: #2563eb;
        }

        #debug-panel {
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            font-size: 0.875rem;
            color: #64748b;
        }

        #last-event, #error-log {
            margin: 0.25rem 0;
        }

        #error-log {
            color: #ef4444;
        }

        /* Scrollbar styling */
        #output::-webkit-scrollbar {
            width: 8px;
        }

        #output::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        #output::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        #output::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        #searching-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.875rem;
        }

        #searching-indicator.hidden {
            display: none;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>
</html>
