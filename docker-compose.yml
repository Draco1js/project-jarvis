version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./server/config.json:/app/server/config.json
    environment:
      - NODE_ENV=production
    command: pnpm start:server

  pi-client:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./pi-client/config.json:/app/pi-client/config.json
      - /dev/snd:/dev/snd  # Mount audio devices
    environment:
      - NODE_ENV=production
    command: pnpm start:client
    depends_on:
      - server 